<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 추천기</title>
<script>
  // ================= AI 성격 (여기를 직접 고쳐 보세요) =================

  // 1) 역할: AI가 누구인지
  const ROLE = `너는 오늘 뭐 먹을지 고민하는 사람을 도와주는 메뉴 추천 도우미야.
말투는 친구처럼 다정하고 짧게 해.`;

  // 2) 규칙: AI가 꼭 지켜야 할 것 (한 줄에 하나씩, 더 넣거나 빼도 돼요)
  const RULES = [
    "사용자가 적은 상황(기분, 날씨, 인원, 예산, 못 먹는 음식)을 꼭 반영해.",
    "메뉴는 딱 3개 추천해.",
    "못 먹는다고 한 재료가 들어간 메뉴는 절대 추천하지 마.",
    "한국에서 쉽게 사 먹거나 만들어 먹을 수 있는 메뉴로 골라.",
    "추천 이유는 한두 문장으로 짧게 써.",
    "음식과 상관없는 질문이면 menus를 빈 배열로 두지 말고, 가볍게 먹을 만한 메뉴를 대신 추천해."
  ];

  // 3) 답 모양: AI가 돌려줄 JSON 모양 (칸 이름을 바꾸면 아래 화면 코드도 같이 바꿔야 해요)
  const ANSWER_FORMAT = `반드시 아래 모양의 JSON 하나만 답해. 앞뒤에 설명 글이나 \`\`\` 기호를 붙이지 마.
{
  "summary": "사용자 상황을 한 문장으로 정리",
  "menus": [
    {
      "name": "메뉴 이름",
      "category": "한식 / 중식 / 일식 / 양식 / 분식 / 기타 중 하나",
      "reason": "이 메뉴를 추천하는 이유",
      "price": "1인분 대략 가격 (예: 약 9,000원)",
      "time": "먹기까지 걸리는 시간 (예: 15분)",
      "spicy": 0부터 3까지 정수 (0 안 매움, 3 아주 매움)
    }
  ],
  "tip": "같이 먹으면 좋은 것이나 한마디 팁"
}`;

  // 4) 입력 글자 수 제한
  const MAX_INPUT = 1000;

  // ================= 연결 설정 =================
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
  const CLASS_CODE = "vibe7128";
  // 제미나이 API 키를 받은 경우: 키는 코드에 적지 말고 화면의 '제미나이 API 키' 칸에 입력하세요.
  // (키를 입력하면 제미나이로 직접 보내고, 비워 두면 위의 중계 서버로 보내요.)
  const GEMINI_MODEL = "gemini-flash-latest";

  // 위의 역할 + 규칙 + 답 모양을 합쳐서 AI에게 보낼 성격 글을 만들어요.
  const SYSTEM_PROMPT =
    "[역할]\n" + ROLE +
    "\n\n[규칙]\n" + RULES.map((r) => "- " + r).join("\n") +
    "\n\n[답 모양]\n" + ANSWER_FORMAT;
  // =====================================================================
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: #fbf6ef;
    color: #2b2420;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 svg { flex: none; }
  .sub { margin: 0 0 18px; color: #7a6b60; font-size: 0.95rem; }

  .key-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 0.88rem; color: #6b5d52; }
  .key-row input {
    flex: 1; min-width: 0; padding: 8px 10px; font-size: 0.9rem;
    border: 1px solid #e3d6c8; border-radius: 8px; background: #fff;
  }

  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    padding: 6px 12px; font-size: 0.85rem; border-radius: 999px;
    border: 1px solid #ead9c6; background: #fff; color: #6b4e36; cursor: pointer;
  }
  .chip:hover { background: #fff1e2; }

  textarea {
    width: 100%; min-height: 110px; padding: 12px; font-size: 1rem;
    border: 1px solid #e3d6c8; border-radius: 12px; resize: vertical;
    font-family: inherit; background: #fff; line-height: 1.5;
  }
  textarea:focus, .key-row input:focus { outline: 2px solid #f1a35b; outline-offset: 1px; }
  .input-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
  #counter { font-size: 0.85rem; color: #9a8b7f; font-variant-numeric: tabular-nums; }
  #counter.full { color: #c0262d; font-weight: 600; }

  .btn {
    padding: 10px 22px; font-size: 1rem; border: none; border-radius: 10px;
    background: #e8742a; color: #fff; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #d3641e; }
  .btn:disabled { background: #e9b48f; cursor: wait; }
  .btn.ghost { background: #fff; color: #b4511a; border: 1px solid #efc4a2; }
  .btn.ghost:hover { background: #fff3ea; }

  #status { margin-top: 16px; color: #8a7a6e; min-height: 1.4em; }
  #result { margin-top: 6px; }

  .summary {
    padding: 14px 16px; background: #fff; border: 1px solid #efe2d3;
    border-radius: 12px; line-height: 1.6; margin-bottom: 14px;
  }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .card {
    background: #fff; border: 1px solid #efe2d3; border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 2px 8px rgba(120, 80, 40, 0.06);
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rank {
    width: 26px; height: 26px; border-radius: 50%; background: #e8742a; color: #fff;
    display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; flex: none;
  }
  .badge {
    font-size: 0.75rem; padding: 3px 9px; border-radius: 999px;
    background: #fff1e2; color: #a2531d; white-space: nowrap;
  }
  .card h3 { margin: 0; font-size: 1.15rem; }
  .card p { margin: 0; color: #5a4c42; line-height: 1.55; font-size: 0.93rem; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82rem; color: #8a7a6e; padding-top: 8px; border-top: 1px dashed #efe2d3; }

  .spicy { display: inline-flex; gap: 3px; vertical-align: middle; }
  .spicy i { width: 9px; height: 9px; border-radius: 50%; background: #eee3d8; display: inline-block; }
  .spicy i.on { background: #d93a1f; }

  h2 { font-size: 1rem; margin: 22px 0 8px; color: #6b5d52; }
  .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #efe2d3; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f3e9de; white-space: nowrap; }
  th { background: #fdf3e8; color: #7a5a40; font-weight: 600; }
  tr:last-child td { border-bottom: none; }

  .tip {
    margin-top: 14px; padding: 12px 16px; border-radius: 12px;
    background: #f0f7ec; border: 1px solid #cfe4c3; color: #3e5a30; line-height: 1.55;
  }
  .tip b { margin-right: 6px; }

  .error-box {
    padding: 16px; border-radius: 12px; background: #fff5f5; border: 1px solid #f0b3b6; color: #a3232a;
  }
  .error-box p { margin: 0 0 12px; line-height: 1.55; }
  .error-box details { margin-top: 12px; color: #6b5d52; font-size: 0.85rem; }
  .error-box pre {
    white-space: pre-wrap; word-break: break-all; background: #fff; padding: 10px;
    border-radius: 8px; border: 1px solid #f3d3d5; max-height: 200px; overflow: auto;
  }
  .placeholder { color: #a8998d; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 17h24a12 12 0 0 1-24 0z" fill="#e8742a"/>
      <path d="M2 17h28" stroke="#b4511a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M11 4c-1.5 2 1.5 3 0 6M16 3c-1.5 2 1.5 3 0 6M21 4c-1.5 2 1.5 3 0 6" stroke="#c9a88a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    메뉴 추천기
  </h1>
  <p class="sub">기분, 날씨, 인원, 예산, 못 먹는 음식 같은 걸 적으면 메뉴 3개를 골라 줘요.</p>

  <div class="key-row">
    <label for="apiKey">제미나이 API 키</label>
    <input id="apiKey" type="password" placeholder="선생님이 주신 키 (없으면 비워 두기)" autocomplete="off">
  </div>

  <div class="examples">
    <button class="chip" type="button">비 오는 날 혼자, 만 원 이하</button>
    <button class="chip" type="button">친구 4명이랑 매운 거, 오이 못 먹음</button>
    <button class="chip" type="button">시험 끝나서 기분 좋은 저녁</button>
  </div>

  <textarea id="question" placeholder="오늘 상황을 적어 주세요 (Ctrl+Enter로 보내기)"></textarea>
  <div class="input-foot">
    <span id="counter">0 / 1000</span>
    <button class="btn" id="sendBtn">추천받기</button>
  </div>

  <div id="status"></div>
  <div id="result"><div class="placeholder">여기에 추천 메뉴가 나와요.</div></div>
</div>

<script>
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const apiKeyEl = document.getElementById("apiKey");
  const counterEl = document.getElementById("counter");

  let lastQuestion = "";

  // ----- 입력 글자 수 제한 -----
  questionEl.maxLength = MAX_INPUT;
  function updateCounter() {
    if (questionEl.value.length > MAX_INPUT) questionEl.value = questionEl.value.slice(0, MAX_INPUT);
    const n = questionEl.value.length;
    counterEl.textContent = n + " / " + MAX_INPUT;
    counterEl.classList.toggle("full", n >= MAX_INPUT);
  }
  questionEl.addEventListener("input", updateCounter);
  updateCounter();

  // 예시 버튼 누르면 입력칸에 채우기
  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      questionEl.value = chip.textContent;
      updateCounter();
      questionEl.focus();
    });
  });

  // 입력한 키는 이 브라우저에만 저장돼요 (GitHub나 사이트에는 올라가지 않아요).
  try { apiKeyEl.value = localStorage.getItem("geminiApiKey") || ""; } catch (e) {}
  apiKeyEl.addEventListener("input", () => {
    try { localStorage.setItem("geminiApiKey", apiKeyEl.value.trim()); } catch (e) {}
  });

  // ----- AI에게 보내기 -----
  // 선생님 중계 서버로 보내기 → 답변 글자 반환 (오류면 throw)
  async function askRelay(question) {
    const res = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        code: CLASS_CODE,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: question }]
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "알 수 없는 오류");
    return data.text;
  }

  // 제미나이 API로 직접 보내기 → 답변 글자 반환 (오류면 throw)
  async function askGemini(question, apiKey) {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: "user", parts: [{ text: question }] }],
        generationConfig: { responseMimeType: "application/json" } // JSON으로만 답하게
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
    const parts = data.candidates?.[0]?.content?.parts || [];
    const text = parts.map((p) => p.text || "").join("").trim();
    if (!text) throw new Error("답변이 비어 있어요.");
    return text;
  }

  // ----- AI 답(JSON) 검사하기 -----
  class ShapeError extends Error {
    constructor(message, raw) { super(message); this.raw = raw; }
  }

  function parseAnswer(text) {
    let s = String(text || "").trim();
    // ```json ... ``` 으로 감싸서 오는 경우 벗겨내기
    s = s.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    // 앞뒤에 잡담이 붙어 오면 { ... } 부분만 꺼내기
    const start = s.indexOf("{");
    const end = s.lastIndexOf("}");
    if (start === -1 || end <= start) throw new ShapeError("답에 JSON이 없어요.", text);
    let data;
    try {
      data = JSON.parse(s.slice(start, end + 1));
    } catch (e) {
      throw new ShapeError("JSON 모양이 깨져 있어요.", text);
    }
    if (!Array.isArray(data.menus) || data.menus.length === 0) {
      throw new ShapeError("추천 메뉴(menus)가 비어 있어요.", text);
    }
    const menus = data.menus.map((m) => {
      if (!m || typeof m.name !== "string" || !m.name.trim()) {
        throw new ShapeError("메뉴 이름(name)이 빠진 칸이 있어요.", text);
      }
      const spicy = Math.max(0, Math.min(3, Math.round(Number(m.spicy) || 0)));
      return {
        name: m.name.trim(),
        category: str(m.category) || "기타",
        reason: str(m.reason) || "",
        price: str(m.price) || "-",
        time: str(m.time) || "-",
        spicy
      };
    });
    return { summary: str(data.summary), menus, tip: str(data.tip) };
  }

  function str(v) {
    return typeof v === "string" ? v.trim() : (typeof v === "number" ? String(v) : "");
  }

  // ----- 화면에 그리기 (textContent만 써서 이상한 글자가 와도 안전해요) -----
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function spicyDots(level) {
    const wrap = el("span", "spicy");
    wrap.title = "매운맛 " + level + " / 3";
    for (let i = 0; i < 3; i++) wrap.appendChild(el("i", i < level ? "on" : ""));
    return wrap;
  }

  function renderResult(data) {
    resultEl.innerHTML = "";

    if (data.summary) resultEl.appendChild(el("div", "summary", data.summary));

    // 카드
    const cards = el("div", "cards");
    data.menus.forEach((m, i) => {
      const card = el("div", "card");
      const top = el("div", "card-top");
      top.appendChild(el("span", "rank", String(i + 1)));
      top.appendChild(el("span", "badge", m.category));
      card.appendChild(top);
      card.appendChild(el("h3", "", m.name));
      card.appendChild(el("p", "", m.reason));
      const meta = el("div", "meta");
      meta.appendChild(el("span", "", m.price));
      meta.appendChild(el("span", "", m.time));
      const sp = el("span", "", "매운맛 ");
      sp.appendChild(spicyDots(m.spicy));
      meta.appendChild(sp);
      card.appendChild(meta);
      cards.appendChild(card);
    });
    resultEl.appendChild(cards);

    // 비교 표
    resultEl.appendChild(el("h2", "", "한눈에 비교"));
    const wrap = el("div", "table-wrap");
    const table = el("table");
    const head = el("tr");
    ["메뉴", "종류", "가격", "시간", "매운맛"].forEach((h) => head.appendChild(el("th", "", h)));
    table.appendChild(head);
    data.menus.forEach((m) => {
      const tr = el("tr");
      tr.appendChild(el("td", "", m.name));
      tr.appendChild(el("td", "", m.category));
      tr.appendChild(el("td", "", m.price));
      tr.appendChild(el("td", "", m.time));
      const td = el("td");
      td.appendChild(spicyDots(m.spicy));
      tr.appendChild(td);
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    resultEl.appendChild(wrap);

    if (data.tip) {
      const tip = el("div", "tip");
      tip.appendChild(el("b", "", "팁"));
      tip.appendChild(document.createTextNode(data.tip));
      resultEl.appendChild(tip);
    }
  }

  function renderError(message, raw) {
    resultEl.innerHTML = "";
    const box = el("div", "error-box");
    box.appendChild(el("p", "", message));
    const retry = el("button", "btn ghost", "다시 시도");
    retry.addEventListener("click", () => ask(lastQuestion));
    box.appendChild(retry);
    if (raw) {
      const details = el("details");
      details.appendChild(el("summary", "", "AI가 보낸 원래 답 보기"));
      details.appendChild(el("pre", "", raw));
      box.appendChild(details);
    }
    resultEl.appendChild(box);
  }

  // ----- 전체 흐름 -----
  async function ask(retryQuestion) {
    const question = (typeof retryQuestion === "string" ? retryQuestion : questionEl.value).trim().slice(0, MAX_INPUT);
    if (!question) {
      resultEl.innerHTML = "";
      resultEl.appendChild(el("div", "error-box", "상황을 먼저 입력해 주세요."));
      return;
    }
    lastQuestion = question;

    sendBtn.disabled = true;
    statusEl.textContent = "메뉴 고르는 중…";
    resultEl.innerHTML = "";

    try {
      const apiKey = apiKeyEl.value.trim();
      const text = apiKey ? await askGemini(question, apiKey) : await askRelay(question);
      renderResult(parseAnswer(text));
    } catch (err) {
      if (err instanceof ShapeError) {
        renderError("AI 답의 모양이 깨져서 왔어요. (" + err.message + ") 다시 시도해 보세요.", err.raw);
      } else {
        renderError("오류: " + err.message);
      }
    } finally {
      statusEl.textContent = "";
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", () => ask());
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
