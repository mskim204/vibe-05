<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; font-family: sans-serif; background: #fff8ee; color: #2b1a05; }
  .box { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  h1 { margin: 0 0 20px; text-align: center; font-size: 26px; }
  label { display: block; font-weight: bold; margin: 16px 0 8px; }
  #code { width: 100%; padding: 14px; font-size: 28px; text-align: center; letter-spacing: 10px; border: 2px solid #e2c9a6; border-radius: 10px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice { padding: 18px 8px; font-size: 20px; border: 2px solid #e2c9a6; border-radius: 12px; background: #fff; cursor: pointer; }
  .choice.on { border-color: #e8590c; background: #ffe8d6; font-weight: bold; }
  #send { width: 100%; margin-top: 20px; padding: 16px; font-size: 20px; font-weight: bold; color: #fff; background: #e8590c; border: 0; border-radius: 12px; cursor: pointer; }
  #send:disabled { background: #c9b6a3; }
  #msg { min-height: 28px; margin-top: 16px; text-align: center; font-size: 20px; font-weight: bold; }
  .ok { color: #2b8a3e; } .err { color: #c92a2a; }
  .row { margin: 14px 0; }
  .row .top { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 6px; }
  .bar { height: 32px; background: #f1e6d8; border-radius: 8px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #e8590c; border-radius: 8px; transition: width .6s; }
  .total { text-align: center; color: #7a6650; margin-top: 16px; }
</style>
</head>
<body>
<div class="box">
<? if (page === 'result') { ?>
  <h1>📊 투표 결과</h1>
  <div id="bars">불러오는 중...</div>
  <p class="total" id="total"></p>
<? } else { ?>
  <h1>🗳️ 간식 투표</h1>
  <label for="code">투표 코드 (숫자 4자리)</label>
  <input id="code" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
  <label>보기 하나를 골라요</label>
  <div class="choices" id="choices"></div>
  <button id="send">투표하기</button>
  <div id="msg"></div>
<? } ?>
</div>

<script>
var PAGE = <?= page ?>;
var CHOICES = ['떡볶이', '치킨', '마라탕', '붕어빵'];
var EMOJI = { '떡볶이': '🌶️', '치킨': '🍗', '마라탕': '🍲', '붕어빵': '🐟' };

if (PAGE === 'result') {
  loadResults();
  setInterval(loadResults, 5000); // 5초마다 새로고침
} else {
  setupVote();
}

function setupVote() {
  var picked = '';
  var box = document.getElementById('choices');
  var code = document.getElementById('code');
  var send = document.getElementById('send');
  var msg = document.getElementById('msg');

  CHOICES.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'choice';
    b.textContent = EMOJI[c] + ' ' + c;
    b.onclick = function () {
      picked = c;
      Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
    box.appendChild(b);
  });

  code.oninput = function () { code.value = code.value.replace(/\D/g, '').slice(0, 4); };

  send.onclick = function () {
    if (!/^\d{4}$/.test(code.value)) return show(false, '코드 숫자 4자리를 넣어 주세요');
    if (!picked) return show(false, '보기를 하나 골라 주세요');
    send.disabled = true;
    show(true, '보내는 중...');
    google.script.run
      .withSuccessHandler(function (r) {
        send.disabled = false;
        show(r.ok, r.message);
        if (r.ok) code.value = '';
      })
      .withFailureHandler(function () {
        send.disabled = false;
        show(false, '잠시 후 다시 해 주세요');
      })
      .vote(code.value, picked);
  };

  function show(ok, text) {
    msg.className = ok ? 'ok' : 'err';
    msg.textContent = text;
  }
}

function loadResults() {
  google.script.run.withSuccessHandler(function (list) {
    var total = list.reduce(function (s, x) { return s + x.count; }, 0);
    var max = Math.max.apply(null, list.map(function (x) { return x.count; })) || 1;
    var bars = document.getElementById('bars');
    if (!bars.querySelector('.row')) {
      bars.innerHTML = '';
      list.forEach(function (x) {
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<div class="top"><span></span><b></b></div><div class="bar"><div></div></div>';
        row.querySelector('span').textContent = EMOJI[x.name] + ' ' + x.name;
        bars.appendChild(row);
      });
    }
    list.forEach(function (x, i) {
      var row = bars.children[i];
      row.querySelector('b').textContent = x.count + '표';
      row.querySelector('.bar div').style.width = (x.count / max * 100) + '%';
    });
    document.getElementById('total').textContent = '모두 ' + total + '표';
  }).getResults();
}
</script>
</body>
</html>
