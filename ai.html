<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 질문 앱</title>
<script>
  // ===== 설정 (여기만 바꾸면 돼요) =====
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
  const CLASS_CODE = "여기에 수업 코드";
  const SYSTEM_PROMPT = "너는 친절한 선생님이야. 학생 눈높이에 맞춰 쉽고 짧게 한국어로 설명해줘.";
  // 수업 코드 대신 제미나이 API 키를 받은 경우: 키는 코드에 적지 말고 화면의 '제미나이 API 키' 칸에 입력하세요.
  // (키를 입력하면 제미나이로 직접 보내고, 비워 두면 위의 중계 서버로 보내요.)
  const GEMINI_MODEL = "gemini-flash-latest";
  // ===================================
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: #f4f6fb;
    color: #222;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .key-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }
  .key-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 0.9rem;
    border: 1px solid #c9cfdc;
    border-radius: 8px;
  }
  textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid #c9cfdc;
    border-radius: 10px;
    resize: vertical;
    font-family: inherit;
  }
  button {
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: #3b6cf6;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #9aa9d6; cursor: wait; }
  #status { margin-top: 14px; color: #666; min-height: 1.4em; }
  #answer {
    margin-top: 8px;
    padding: 16px;
    min-height: 120px;
    background: #fff;
    border: 1px solid #dde2ec;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  #answer.error { color: #c0262d; border-color: #f0b3b6; background: #fff5f5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 AI에게 질문하기</h1>

  <div class="key-row">
    <label for="apiKey">제미나이 API 키</label>
    <input id="apiKey" type="password" placeholder="선생님이 주신 키 (없으면 비워 두기)" autocomplete="off">
  </div>

  <textarea id="question" placeholder="궁금한 것을 입력하세요 (Ctrl+Enter로 보내기)"></textarea>
  <button id="sendBtn">보내기</button>

  <div id="status"></div>
  <div id="answer">여기에 답변이 나와요.</div>
</div>

<script>
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const answerEl = document.getElementById("answer");
  const apiKeyEl = document.getElementById("apiKey");

  // 입력한 키는 이 브라우저에만 저장돼요 (GitHub나 사이트에는 올라가지 않아요).
  try { apiKeyEl.value = localStorage.getItem("geminiApiKey") || ""; } catch (e) {}
  apiKeyEl.addEventListener("input", () => {
    try { localStorage.setItem("geminiApiKey", apiKeyEl.value.trim()); } catch (e) {}
  });

  // 선생님 중계 서버로 보내기 → 답변 글자 반환 (오류면 throw)
  async function askRelay(question) {
    const res = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        code: CLASS_CODE,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: question }]
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "알 수 없는 오류");
    return data.text;
  }

  // 제미나이 API로 직접 보내기 → 답변 글자 반환 (오류면 throw)
  async function askGemini(question, apiKey) {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: "user", parts: [{ text: question }] }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
    const parts = data.candidates?.[0]?.content?.parts || [];
    const text = parts.map((p) => p.text || "").join("").trim();
    if (!text) throw new Error("답변이 비어 있어요.");
    return text;
  }

  function showAnswer(text, isError) {
    answerEl.textContent = text;
    answerEl.classList.toggle("error", !!isError);
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) {
      showAnswer("질문을 먼저 입력해 주세요.", true);
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = "생각 중…";
    showAnswer("", false);

    try {
      const apiKey = apiKeyEl.value.trim();
      const text = apiKey ? await askGemini(question, apiKey) : await askRelay(question);
      showAnswer(text, false);
    } catch (err) {
      showAnswer("오류: " + err.message, true);
    } finally {
      statusEl.textContent = "";
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", ask);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
