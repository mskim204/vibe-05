<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 질문 앱</title>
<script>
  // ===== 설정 (여기만 바꾸면 돼요) =====
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
  const CLASS_CODE = "여기에 수업 코드";
  const SYSTEM_PROMPT = "너는 친절한 선생님이야. 학생 눈높이에 맞춰 쉽고 짧게 한국어로 설명해줘.";
  // ===================================
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: #f4f6fb;
    color: #222;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid #c9cfdc;
    border-radius: 10px;
    resize: vertical;
    font-family: inherit;
  }
  button {
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: #3b6cf6;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #9aa9d6; cursor: wait; }
  #status { margin-top: 14px; color: #666; min-height: 1.4em; }
  #answer {
    margin-top: 8px;
    padding: 16px;
    min-height: 120px;
    background: #fff;
    border: 1px solid #dde2ec;
    border-radius: 10px;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  #answer.error { color: #c0262d; border-color: #f0b3b6; background: #fff5f5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 AI에게 질문하기</h1>

  <textarea id="question" placeholder="궁금한 것을 입력하세요 (Ctrl+Enter로 보내기)"></textarea>
  <button id="sendBtn">보내기</button>

  <div id="status"></div>
  <div id="answer">여기에 답변이 나와요.</div>
</div>

<script>
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const answerEl = document.getElementById("answer");

  function showAnswer(text, isError) {
    answerEl.textContent = text;
    answerEl.classList.toggle("error", !!isError);
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) {
      showAnswer("질문을 먼저 입력해 주세요.", true);
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = "생각 중…";
    showAnswer("", false);

    try {
      const res = await fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          code: CLASS_CODE,
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: question }]
        })
      });

      const data = await res.json();

      if (data.ok) {
        showAnswer(data.text, false);
      } else {
        showAnswer("오류: " + (data.error || "알 수 없는 오류"), true);
      }
    } catch (err) {
      showAnswer("오류: 서버에 연결하지 못했어요. (" + err.message + ")", true);
    } finally {
      statusEl.textContent = "";
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", ask);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
