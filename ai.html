<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 질문 앱</title>
<script>
  // ===== 설정 (여기만 바꾸면 돼요) =====
  const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
  const CLASS_CODE = "vibe7128";
  const SYSTEM_PROMPT = "너는 친절한 선생님이야. 학생 눈높이에 맞춰 쉽고 짧게 한국어로 설명해줘."; // 기본 AI 성격
  // 화면의 'AI 성격' 목록에 나오는 보기들 (자유롭게 추가·수정하세요)
  const PERSONAS = [
    { name: "😊 친절한 선생님", prompt: SYSTEM_PROMPT },
    { name: "🤪 장난꾸러기 친구", prompt: "너는 장난기 많은 내 친구야. 반말로, 이모지를 섞어서 재미있고 짧게 대답해줘." },
    { name: "🧐 소크라테스", prompt: "너는 소크라테스처럼 대화하는 선생님이야. 답을 바로 알려주지 말고, 학생이 스스로 생각하도록 짧은 질문으로 이끌어줘." },
    { name: "🏴‍☠️ 해적 선장", prompt: "너는 유쾌한 해적 선장이야. '으하하!' 같은 해적 말투로, 하지만 내용은 정확하고 짧게 한국어로 대답해줘." },
    { name: "📚 꼼꼼한 박사님", prompt: "너는 꼼꼼한 박사님이야. 핵심을 먼저 말하고, 이유와 예시를 번호를 매겨 정리해서 한국어로 설명해줘." }
  ];
  // 수업 코드 대신 제미나이 API 키를 받은 경우: 키는 코드에 적지 말고 화면의 '제미나이 API 키' 칸에 입력하세요.
  // (키를 입력하면 제미나이로 직접 보내고, 비워 두면 위의 중계 서버로 보내요.)
  const GEMINI_MODEL = "gemini-flash-latest";
  const MAX_MESSAGES = 10; // AI에게 보낼 최근 메시지 수 (질문·답 하나하나가 1개, 이번 질문 포함)
  // ===================================
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: #f4f6fb;
    color: #222;
  }
  .wrap {
    max-width: 640px;
    height: 100%;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 1.4rem; margin: 0; }
  #newChatBtn {
    height: 36px;
    padding: 0 14px;
    font-size: 0.9rem;
    background: #fff;
    color: #3b6cf6;
    border: 1px solid #3b6cf6;
    border-radius: 10px;
  }
  .persona {
    margin-bottom: 12px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid #dde2ec;
    border-radius: 12px;
    font-size: 0.9rem;
  }
  .persona summary { cursor: pointer; font-weight: 600; }
  .persona summary span { font-weight: normal; color: #3b6cf6; }
  .persona select, .persona textarea {
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    border: 1px solid #c9cfdc;
    border-radius: 8px;
    font-family: inherit;
  }
  .persona textarea { height: 72px; max-height: none; resize: vertical; }
  .key-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }
  .key-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font-size: 0.9rem;
    border: 1px solid #c9cfdc;
    border-radius: 8px;
  }

  /* 대화 창 */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #fff;
    border: 1px solid #dde2ec;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty { margin: auto; color: #999; text-align: center; }

  /* 말풍선 */
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: #3b6cf6;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    align-self: flex-start;
    background: #eef1f7;
    color: #222;
    border-bottom-left-radius: 4px;
  }
  .bubble.thinking { color: #777; font-style: italic; }
  .bubble.error {
    background: #fff1f1;
    color: #c0262d;
    border: 1px solid #f0b3b6;
  }

  /* 입력 줄 */
  .input-row { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
  textarea {
    flex: 1;
    min-width: 0;
    height: 48px;
    max-height: 140px;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid #c9cfdc;
    border-radius: 12px;
    resize: none;
    font-family: inherit;
  }
  button {
    height: 48px;
    padding: 0 20px;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    background: #3b6cf6;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:disabled { background: #9aa9d6; cursor: wait; }
  .hint { margin: 6px 2px 0; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🤖 AI에게 질문하기</h1>
    <button id="newChatBtn" type="button">새 대화</button>
  </div>

  <details class="persona" id="personaBox">
    <summary>🎭 AI 성격: <span id="personaName"></span></summary>
    <select id="personaSelect"></select>
    <textarea id="systemPrompt" placeholder="AI에게 어떤 성격으로 대답할지 적어 주세요"></textarea>
  </details>

  <div class="key-row">
    <label for="apiKey">제미나이 API 키</label>
    <input id="apiKey" type="password" placeholder="선생님이 주신 키 (없으면 비워 두기)" autocomplete="off">
  </div>

  <div id="chat">
    <div class="empty" id="empty">궁금한 것을 물어보세요!</div>
  </div>

  <div class="input-row">
    <textarea id="question" placeholder="질문을 입력하세요"></textarea>
    <button id="sendBtn">보내기</button>
  </div>
  <p class="hint">Enter: 보내기 · Shift+Enter: 줄바꿈</p>
</div>

<script>
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const chatEl = document.getElementById("chat");
  const emptyEl = document.getElementById("empty");
  const apiKeyEl = document.getElementById("apiKey");

  // 지금까지 주고받은 대화 (AI가 앞의 내용을 기억하도록 순서대로 같이 보내요)
  let history = []; // [{ role: "user" | "assistant", content: "..." }]
  let chatId = 0;   // [새 대화]를 누를 때마다 바뀌어요 (이전 대화의 늦은 답이 섞이지 않게)

  // 이번에 보낼 messages: 지난 대화 + 이번 질문 중 최근 MAX_MESSAGES개
  function buildMessages(question) {
    let messages = [...history, { role: "user", content: question }].slice(-MAX_MESSAGES);
    // 대화는 항상 질문(user)으로 시작해야 해서, 맨 앞이 AI 답이면 빼요
    while (messages.length && messages[0].role !== "user") messages.shift();
    return messages;
  }

  // 입력한 키는 이 브라우저에만 저장돼요 (GitHub나 사이트에는 올라가지 않아요).
  try { apiKeyEl.value = localStorage.getItem("geminiApiKey") || ""; } catch (e) {}
  apiKeyEl.addEventListener("input", () => {
    try { localStorage.setItem("geminiApiKey", apiKeyEl.value.trim()); } catch (e) {}
  });

  // ----- AI 성격 -----
  const personaSelect = document.getElementById("personaSelect");
  const systemPromptEl = document.getElementById("systemPrompt");
  const personaNameEl = document.getElementById("personaName");

  PERSONAS.forEach((p, i) => personaSelect.add(new Option(p.name, i)));
  personaSelect.add(new Option("✏️ 직접 쓰기", "custom"));

  function getSystemPrompt() {
    return systemPromptEl.value.trim() || SYSTEM_PROMPT;
  }

  // 목록 선택이나 글 내용이 바뀌면 이름 표시 + 이 브라우저에 저장
  function savePersona() {
    personaNameEl.textContent = personaSelect.selectedOptions[0].text;
    try { localStorage.setItem("aiPersona", JSON.stringify({ sel: personaSelect.value, prompt: systemPromptEl.value })); } catch (e) {}
  }

  personaSelect.addEventListener("change", () => {
    const p = PERSONAS[personaSelect.value];
    if (p) systemPromptEl.value = p.prompt;
    else systemPromptEl.focus();
    savePersona();
  });
  systemPromptEl.addEventListener("input", () => {
    // 보기 글을 고치면 '직접 쓰기'로 바뀌어요
    const p = PERSONAS[personaSelect.value];
    if (p && systemPromptEl.value !== p.prompt) personaSelect.value = "custom";
    savePersona();
  });

  // 지난번에 고른 성격 불러오기 (없으면 첫 번째 보기)
  (function loadPersona() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("aiPersona")); } catch (e) {}
    if (saved && typeof saved.prompt === "string" && (saved.sel === "custom" || PERSONAS[saved.sel])) {
      personaSelect.value = saved.sel;
      systemPromptEl.value = saved.prompt;
    } else {
      personaSelect.value = "0";
      systemPromptEl.value = PERSONAS[0].prompt;
    }
    personaNameEl.textContent = personaSelect.selectedOptions[0].text;
  })();

  // 선생님 중계 서버로 보내기 → 답변 글자 반환 (오류면 throw)
  async function askRelay(messages) {
    const res = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ code: CLASS_CODE, system: getSystemPrompt(), messages })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "알 수 없는 오류");
    return data.text;
  }

  // 제미나이 API로 직접 보내기 → 답변 글자 반환 (오류면 throw)
  async function askGemini(messages, apiKey) {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: getSystemPrompt() }] },
        contents: messages.map((m) => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }]
        }))
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
    const parts = data.candidates?.[0]?.content?.parts || [];
    const text = parts.map((p) => p.text || "").join("").trim();
    if (!text) throw new Error("답변이 비어 있어요.");
    return text;
  }

  // 말풍선 하나 추가하고 그 요소를 돌려줘요
  function addBubble(text, type) {
    if (emptyEl.parentNode) emptyEl.remove();
    const div = document.createElement("div");
    div.className = "bubble " + type;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  let busy = false;

  // [새 대화]: 기억과 화면의 말풍선을 모두 지워요
  function newChat() {
    chatId++;
    history = [];
    chatEl.innerHTML = "";
    chatEl.appendChild(emptyEl);
    busy = false;
    sendBtn.disabled = false;
    questionEl.focus();
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (busy || !question) return;

    busy = true;
    sendBtn.disabled = true;
    questionEl.value = "";

    addBubble(question, "user");
    const aiBubble = addBubble("생각 중…", "ai thinking");

    const messages = buildMessages(question);
    const myChatId = chatId;

    try {
      const apiKey = apiKeyEl.value.trim();
      const text = apiKey ? await askGemini(messages, apiKey) : await askRelay(messages);
      if (myChatId !== chatId) return; // 그사이 [새 대화]를 눌렀으면 버려요
      aiBubble.textContent = text;
      aiBubble.className = "bubble ai";
      history.push({ role: "user", content: question }, { role: "assistant", content: text });
    } catch (err) {
      if (myChatId !== chatId) return;
      aiBubble.textContent = "오류: " + err.message;
      aiBubble.className = "bubble ai error";
    } finally {
      if (myChatId !== chatId) return;
      chatEl.scrollTop = chatEl.scrollHeight;
      busy = false;
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  sendBtn.addEventListener("click", ask);
  document.getElementById("newChatBtn").addEventListener("click", newChat);
  questionEl.addEventListener("keydown", (e) => {
    // 한글 입력 중(조합 중)에는 Enter를 무시해야 글자가 두 번 보내지지 않아요
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });
</script>
</body>
</html>
