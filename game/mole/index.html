<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#140e14">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="두더지 광산">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>두더지 광산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: pixel mine shaft on the left, a crate-like ledger panel on the right; stacks on phones */
:root{
  --bg:#140e14; --panel:#241a25; --panel-hi:#3a2a3d; --panel-lo:#150e16; --edge:#07040a; --row:#2d2130;
  --text:#f4e8d6; --muted:#a8968f; --dim:#6d5e66;
  --gold:#f6c64b; --gold-hi:#fff0a6; --gold-lo:#b07d1c;
  --ruby:#ff7a4a; --mint:#62e0b4; --sky:#8fd0ff; --crys:#ff7ad9;
  --f-pix:'Silkscreen','Do Hyeon',ui-monospace,monospace;
  --f-ko:'Do Hyeon','Silkscreen',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:var(--f-ko);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.num{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.px{background:var(--panel);box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo)}
.pixicon canvas,canvas.pi{image-rendering:pixelated;display:block}

#app{height:100%;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding-block:14px}

/* header */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand canvas{width:44px;height:44px}
.brand h1{margin:0;font-weight:400;font-size:28px;letter-spacing:.02em;color:var(--gold);text-shadow:3px 3px 0 var(--edge)}
.brand p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo)}
.stat canvas{width:24px;height:24px}
.stat b{font-family:var(--f-pix);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--gold)}
.stat .lbl{color:var(--muted);font-size:15px}
.stat .unit{color:var(--muted);font-family:var(--f-pix)}
.iconbtn{width:42px;height:42px;border:0;cursor:pointer;background:var(--panel);font-size:20px;box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo)}
.iconbtn[aria-pressed="true"]{color:var(--dim)}
a.iconbtn{display:grid;place-items:center;color:var(--text);text-decoration:none}
.hbtns{display:flex;gap:12px}

main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;min-height:0}

/* stage */
.stage{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.hud{padding:10px 14px;display:grid;gap:8px}
.hudrow{display:flex;align-items:baseline;gap:10px}
#bname{font-size:19px}
#bname.boss{color:var(--ruby)}
#nextboss{color:var(--muted);font-size:14px;margin-right:auto}
#bhp{font-size:13px;color:var(--muted)}
.bar{position:relative;height:14px;background:#0d080e;box-shadow:0 0 0 2px var(--edge)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(#ff9f6b 0 30%,#e5533f 30% 75%,#a8302a 75%)}
.bar.hp i{background:linear-gradient(#9cf07a 0 30%,#4fb03a 30% 75%,#2f7a26 75%)}
.bar.boss i{background:linear-gradient(#ffe08a 0 30%,#f6a23b 30% 75%,#b8641c 75%)}
.bar.boss span{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:var(--f-pix);font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}

.screenwrap{flex:1;min-height:0;display:grid;place-items:center}
.screen{position:relative;width:100%;max-width:max(300px,calc((100dvh - 350px)*4/3));aspect-ratio:4/3;cursor:pointer;touch-action:manipulation;
  box-shadow:0 0 0 4px var(--edge),0 0 0 7px #4a3550,0 0 0 10px var(--edge);background:#000;outline:none}
.screen:focus-visible{box-shadow:0 0 0 4px var(--edge),0 0 0 7px var(--sky),0 0 0 10px var(--edge)}
.screen canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx span{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-pix);font-weight:700;font-size:clamp(12px,2vw,18px);color:#fff;white-space:nowrap;
  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;animation:rise .8s steps(8) forwards}
#fx .crit{color:var(--ruby);font-size:clamp(15px,2.8vw,26px)}
#fx .gold{color:var(--gold)}
#fx .big{font-size:clamp(15px,2.6vw,24px)}
#fx .dps{color:#c9b6dd;font-size:clamp(10px,1.5vw,14px);font-weight:400}
#fx .tag{color:var(--sky);font-family:var(--f-ko);font-weight:400}
@keyframes rise{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,-190%);opacity:0}}
#banner{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;opacity:0}
#banner b{font-weight:400;font-size:clamp(22px,4.4vw,40px);color:var(--gold);text-shadow:3px 3px 0 var(--edge),-2px -2px 0 var(--edge),2px -2px 0 var(--edge),-2px 2px 0 var(--edge)}
#banner small{font-family:var(--f-pix);font-size:clamp(11px,1.6vw,15px);color:#fff;text-shadow:2px 2px 0 var(--edge)}
#banner.show{animation:ban 2.8s steps(28) forwards}
@keyframes ban{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#buffs{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#buffs span{font-size:14px;padding:3px 8px;background:#07040ad9;color:var(--gold);box-shadow:0 0 0 2px var(--gold-lo)}
#retry{position:absolute;left:50%;bottom:9%;transform:translateX(-50%)}
#hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:clamp(14px,2.2vw,20px);color:#fff;text-shadow:2px 2px 0 var(--edge);pointer-events:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.sub{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;color:var(--muted);font-size:15px}
.sub b{font-family:var(--f-pix);color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:0;cursor:pointer;padding:7px 12px;margin:3px;color:#2b1a05;background:var(--gold);font-size:15px;
  box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 var(--gold-hi),inset -3px -3px 0 var(--gold-lo)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{cursor:not-allowed;color:#8c7d86;background:#463a45;box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 #5a4b57,inset -3px -3px 0 #30262f}
.btn.danger{background:#e5533f;color:#fff;box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 #ff9a7a,inset -3px -3px 0 #96281e}
.btn.crys{background:var(--crys);color:#2a0820;box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 #ffc4ef,inset -3px -3px 0 #a83a8a}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* panel */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:8px 8px 0}
.tabs button{position:relative;border:0;background:transparent;cursor:pointer;padding:10px 2px;font-size:16px;white-space:nowrap;color:var(--muted);box-shadow:inset 0 -3px 0 var(--edge)}
.tabs button[aria-selected="true"]{color:var(--gold);background:var(--row);box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px 0 0 var(--edge)}
.tabs .num{font-size:10px;color:var(--dim)}
#toolDot,#questDot{position:absolute;top:6px;right:8px;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--edge)}
.tabbody{flex:1;min-height:0;overflow:auto;padding:12px 12px 16px;scrollbar-color:#4a3550 transparent}
.amt{display:flex;align-items:center;gap:4px;margin-bottom:10px;color:var(--muted);font-size:14px}
.amt span{margin-right:auto}
.amt button{border:0;cursor:pointer;padding:4px 8px;font-family:var(--f-pix);font-size:12px;background:var(--row);color:var(--muted);box-shadow:0 0 0 2px var(--edge)}
.amt button[aria-pressed="true"]{background:var(--gold);color:#2b1a05}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;background:var(--row);box-shadow:0 0 0 2px var(--edge)}
.row .ico{position:relative;width:48px;height:48px;background:#1a121b;box-shadow:inset 2px 2px 0 #0c070d;display:grid;place-items:center}
.row .ico canvas{width:36px;height:36px}
.row .ico .lv{position:absolute;right:-4px;bottom:-6px;font-family:var(--f-pix);font-size:11px;padding:0 4px;background:var(--edge);color:var(--gold)}
.row .nm{font-size:17px;line-height:1.2}
.row .ds{font-size:13px;color:var(--muted)}
.row .meta{font-size:13px;color:var(--muted);margin-top:2px}
.row .meta b{font-family:var(--f-pix);color:var(--mint);font-weight:400;font-size:12px}
.row .buy{display:grid;justify-items:end;gap:0;min-width:84px;padding:6px 10px}
.row .buy small{font-family:var(--f-pix);font-size:10px;opacity:.75}
.row .buy span{font-family:var(--f-pix);font-size:13px;font-weight:700}
.row.locked .nm,.row.locked .ds{color:var(--dim)}
.row.done{box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--mint)}
.qbar{height:8px;margin-top:6px;background:#0d080e;box-shadow:0 0 0 2px var(--edge)}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#62e0b4,#8fd0ff)}
.card .big canvas.pi{width:32px;height:32px}
#bless,#welcome{position:absolute;inset:0;z-index:3;display:grid;align-content:center;justify-items:center;gap:8px;padding:10px;background:#07040ae6;cursor:default}
#bless h2,#welcome h2{margin:0;font-weight:400;font-size:clamp(17px,3.2vw,28px);color:var(--gold);text-shadow:3px 3px 0 var(--edge);text-align:center}
#bless p,#welcome p{margin:0;color:var(--muted);font-size:clamp(11px,1.6vw,14px);text-align:center}
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.4vw,14px);width:100%;max-width:560px}
.bcard{display:grid;justify-items:center;align-content:start;gap:4px;padding:clamp(6px,1.2vw,12px) 4px;border:0;cursor:pointer;background:var(--row);text-align:center;
  box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px #4a3550;animation:cardin .3s steps(4) both}
.bcard:hover,.bcard:focus-visible{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--gold);transform:translateY(-3px)}
.bcard canvas{width:clamp(24px,4.5vw,40px);height:clamp(24px,4.5vw,40px);image-rendering:pixelated}
.bcard b{font-weight:400;font-size:clamp(13px,2vw,18px);line-height:1.1}
.bcard small{font-size:clamp(10px,1.5vw,13px);color:var(--muted);line-height:1.2}
.bcard em{font-style:normal;font-family:var(--f-pix);font-size:10px;color:var(--mint)}
.bcard.leg{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--crys)}
.bcard.leg b{color:var(--crys)}
#welcome{z-index:4}
#welcome b{font-family:var(--f-pix);font-size:clamp(20px,4vw,34px);color:var(--gold);text-shadow:3px 3px 0 var(--edge)}
#wCrew{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#wCrew canvas{width:clamp(22px,4vw,34px);height:clamp(22px,4vw,34px);image-rendering:pixelated}
.relic.hat{border:0;cursor:pointer;font:inherit;color:inherit}
.relic.hat:disabled{cursor:default}
.relic.hat.on{box-shadow:0 0 0 2px var(--edge),inset 0 0 0 2px var(--gold)}
.relic.hat.on small{color:var(--gold)}
@keyframes cardin{from{opacity:0;transform:translateY(12px)}}
.empty{color:var(--muted);font-size:15px;padding:16px 4px;text-align:center}
.foot{color:var(--dim);font-size:13px;margin-top:12px;text-align:center}
h3{margin:14px 0 8px;font-weight:400;font-size:15px;color:var(--muted);letter-spacing:.03em}
h3:first-child{margin-top:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.relic{display:grid;justify-items:center;gap:4px;padding:8px 4px;background:var(--row);box-shadow:0 0 0 2px var(--edge);text-align:center}
.relic canvas{width:36px;height:36px}
.relic b{font-weight:400;font-size:14px;line-height:1.15}
.relic small{font-size:12px;color:var(--mint)}
.relic.no b,.relic.no small{color:var(--dim)}
.sumbox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sumbox span{font-size:13px;padding:3px 8px;background:var(--row);box-shadow:0 0 0 2px var(--edge);color:var(--mint)}
.card{padding:14px;background:var(--row);box-shadow:0 0 0 2px var(--edge);display:grid;gap:10px}
.card p{margin:0;font-size:15px;color:var(--muted)}
.card .big{display:flex;align-items:center;gap:10px;font-size:18px}
.card .big canvas{width:32px;height:32px}
.card .big b{font-family:var(--f-pix);color:var(--crys);font-size:22px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;color:var(--muted)}
.kv b{font-family:var(--f-pix);color:var(--text);font-weight:400;font-size:14px;text-align:right}
#saveCode{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;padding:8px;border:0;background:#0d080e;color:var(--text);font-family:var(--f-pix);font-size:11px;line-height:1.4;
  word-break:break-all;-webkit-user-select:text;user-select:text;box-shadow:0 0 0 2px var(--edge)}
#saveCode:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.help summary{cursor:pointer;font-size:16px;color:var(--gold);list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:'▶ ';font-size:11px}
.help[open] summary::before{content:'▼ '}
.help ul{margin:10px 0 0;padding-left:18px;display:grid;gap:7px;font-size:14px;color:var(--muted)}
.help b{color:var(--text);font-weight:400}

.skills{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.skill{position:relative;display:grid;grid-template-columns:auto auto;align-items:center;gap:0 8px;padding:6px 18px 6px 8px;border:0;cursor:pointer;background:var(--panel);text-align:left;overflow:hidden;
  box-shadow:0 0 0 3px var(--edge),inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo)}
.skill canvas{grid-row:span 2;width:30px;height:30px;image-rendering:pixelated}
.skill b{font-weight:400;font-size:15px;line-height:1.1}
.skill small{font-size:12px;color:var(--muted)}
.skill kbd{position:absolute;right:5px;top:3px;font-family:var(--f-pix);font-size:10px;color:var(--dim)}
.skill .cdv{position:absolute;inset:0;background:#07040ab0;transform-origin:right;pointer-events:none}
.skill:disabled{cursor:not-allowed}
.skill.locked canvas{opacity:.3}
.skill.locked b{color:var(--dim)}
.skill.ready{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--gold)}
.skill:active:not(:disabled){transform:translateY(2px)}
#combo{position:absolute;right:8px;top:8px;display:grid;justify-items:end;gap:4px;pointer-events:none}
#combo b{font-family:var(--f-pix);font-size:clamp(12px,1.9vw,17px);color:var(--ruby);text-shadow:2px 2px 0 var(--edge)}
#combo .cm{width:clamp(60px,10vw,100px);height:8px;background:#07040acc;box-shadow:0 0 0 2px var(--edge)}
#combo .cm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6c64b,#ff7a4a)}
#combo.max b{color:var(--gold)}
.ach{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--row);box-shadow:0 0 0 2px var(--edge)}
.ach canvas{width:36px;height:36px}
.ach b{display:block;font-weight:400;font-size:16px}
.ach small{font-size:13px;color:var(--muted)}
.ach em{font-style:normal;font-family:var(--f-pix);font-size:11px;color:var(--mint)}
.ach.no b{color:var(--dim)}
.ach.no canvas{opacity:.3}
.ach.no em{color:var(--dim)}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:20;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:15px;background:#0c070df2;box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px #4a3550;animation:tin .25s steps(4)}
.toast canvas{width:30px;height:30px;flex:none}
.toast.win{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--gold)}
.toast.warn{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--ruby)}
.toast.relic{box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px var(--mint)}
.toast.out{opacity:0;transition:opacity .3s steps(3)}
@keyframes tin{from{transform:translateX(24px);opacity:0}}

@media (max-width:880px){
  html,body{height:auto}
  #app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .screen{max-width:100%}
  .tabbody{overflow:visible}
  .brand h1{font-size:24px}
  .stat b{font-size:18px}
}
@media (max-width:520px){
  .top{gap:10px}
  .brand{width:100%}
  .stats{width:100%}
  .stat{flex:1;justify-content:center}
  .hbtns{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
  .skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .skill{grid-template-columns:auto;justify-items:center;text-align:center;padding:6px 4px}
  .skill canvas{grid-row:auto;width:24px;height:24px}
  .skill b{font-size:14px}
  .skill small{font-size:11px}
  .tabs button{font-size:14px}
  .tabs .num{display:none}
  .row{grid-template-columns:40px minmax(0,1fr) auto;gap:8px}
  .row .ico{width:40px;height:40px}
  .row .ico canvas{width:30px;height:30px}
  .row .buy{min-width:72px;padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){
  #fx span{animation-duration:.5s}
  #hint{animation:none}
}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span id="logo" class="pixicon"></span>
      <div><h1>두더지 광산</h1><p id="biome">표토층</p></div>
    </div>
    <div class="stats">
      <div class="stat gold" title="골드"><span id="coinIco" class="pixicon"></span><b id="gold">0</b></div>
      <div class="stat"><span class="lbl">깊이</span><b id="depth">0</b><span class="unit">m</span></div>
    </div>
    <div class="hbtns">
      <button id="install" class="iconbtn" hidden aria-label="앱으로 설치" title="홈 화면에 앱으로 설치">📲</button>
      <a id="home" class="iconbtn" href="../../" aria-label="처음 화면으로" title="처음 화면으로">⌂</a>
      <button id="mute" class="iconbtn" aria-label="소리 켜고 끄기" aria-pressed="false">♪</button>

}

const SHAPES={
  coin:(x,y,dx,dy)=>{const r=hyp(dx,dy);return r>4.9?0:A(r-2.9)<.6?2:1;},
  orb:(x,y,dx,dy)=>hyp(dx,dy)>4.7?0:hyp(dx+1.6,dy+1.6)<1.2?4:1,
  tooth:(x,y)=>((y>=1&&y<=5&&x>=2&&x<=9)||(y>=6&&y<=10&&((x>=2&&x<=(y>8?3:4))||(x>=(y>8?8:7)&&x<=9))))?1:0,
  sun:(x,y,dx,dy)=>{const r=hyp(dx,dy);if(r<=3.2)return A(r-1.9)<.5?2:1;if(r<=5.3&&(A(dx)<.8||A(dy)<.8||A(A(dx)-A(dy))<.8))return 1;return 0;},
  trilo:(x,y,dx,dy)=>(dx/3.9)**2+(dy/5.3)**2>1?0:((y%2===0&&A(dx)>1)||A(dx)<.6)?2:1,
  diamond:(x,y,dx,dy)=>{if(dy<-5||dy>4)return 0;return A(dx)<=(dy+5)*.5?(A(dx)<.6?2:1):0;},
  spore:(x,y,dx,dy)=>hyp(dx,dy)>4.6?0:((x*3+y*5)%7===0?4:1),
  crown:(x,y)=>(y>=6&&y<=9&&x>=1&&x<=10)?((y===7&&(x===3||x===8))?3:(y===7&&(x===5||x===6))?4:1):(y>=2&&y<6&&((x>=1&&x<=2)||(x>=5&&x<=6)||(x>=9&&x<=10)))?1:0,
  helmet:(x,y,dx,dy)=>(dy<=1&&hyp(dx,dy-1)<=4.8)?(A(dx)<.6&&dy<0?2:1):(dy>1&&dy<=3&&A(dx)<=5.2)?2:0,
  feather:(x,y,dx,dy)=>{const u=(dx+dy)/1.414,v=(dx-dy)/1.414;if((u/5.4)**2+(v/2.2)**2>1)return 0;return A(v)<.5?2:1;},
  clock:(x,y,dx,dy)=>{const r=hyp(dx,dy);if(r>4.8)return 0;if(r>3.9)return 2;if((A(dx)<.6&&dy<0&&dy>-3.2)||(A(dy)<.6&&dx>0&&dx<2.6))return 3;return 1;},
  flake:(x,y,dx,dy)=>((A(dx)<.8&&A(dy)<5)||(A(dy)<.8&&A(dx)<5)||(A(dx-dy)<.9&&A(dx)<3.6)||(A(dx+dy)<.9&&A(dx)<3.6))?(hyp(dx,dy)<1.2?4:1):0,
  blade:(x,y,dx,dy)=>{const u=(dx-dy)/1.414,v=(dx+dy)/1.414;
    if(u>=-1.2&&u<=5.8&&A(v)<=1.8*(1-Math.max(0,u-2.6)/3.4))return A(v)<.5?4:1;

function shapeIcon(name,color,silhouette){
  const f=SHAPES[name],g=[];
  for(let y=0;y<12;y++)for(let x=0;x<12;x++)g.push(f(x,y,x-5.5,y-5.5)|0);
  const at=(x,y)=>(x<0||y<0||x>11||y>11)?0:g[y*12+x];
  const c=mk(12,12),cx=c.getContext('2d'),lt=shade(color,1.35),dk=shade(color,.62),md=shade(color,.8);
  for(let y=0;y<12;y++)for(let x=0;x<12;x++){
    const v=at(x,y);
    if(!v){if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){cx.fillStyle='#07040a';cx.fillRect(x,y,1,1);}continue;}
    let col;
    if(silhouette)col='#3a2d3a';
    else if(v===3)col='#1b1424';else if(v===4)col='#fff8e8';else if(v===2)col=md;
    else{col=color;if(!at(x-1,y)||!at(x,y-1))col=lt;else if(!at(x+1,y)||!at(x,y+1))col=dk;}
    cx.fillStyle=col;cx.fillRect(x,y,1,1);
  }
  return c;
}

function recalc(){
  const r={click:0,dps:0,gold:0,crit:0,boss:0,luck:0};
  RELICS.forEach(x=>{if(S.relics[x.id])r[x.t]+=x.v;});
  const cry=1+BAL.cryPer*S.crystals;
  let pick=1,tier=0;PICKS.forEach((p,i)=>{if(S.up['pick'+i]){pick*=p[2];tier=i+1;}});
  let glove=0;GLOVES.forEach((g,i)=>{if(S.up['glove'+i])glove+=g[2];});
  const rush=(buffs.rush>0?5:1)*(buffs.stop>0?2:1);
  const ach=1+ACH_BONUS*ACH.filter(a=>S.ach[a.id]).length;
  D.helperDps=HELPERS.map((h,i)=>{const l=S.helpers[i];let m=Math.pow(2,msCount(l));if(S.up['tr'+i])m*=2;if(S.up['el'+i])m*=3;return h.p*l*m*(1+r.dps+.4*bl('crew'))*Math.pow(2,bl('army'))*cry*ach*rush;});
  D.dps=D.helperDps.reduce((a,b)=>a+b,0);
  D.click=(pick*(1+r.click+.6*bl('sharp'))*Math.pow(2,bl('twin'))*cry*ach+D.dps*glove)*(buffs.frenzy>0?7:1)*(buffs.fever>0?3:1);
  D.critChance=(S.up.clover?.08:0)+r.crit+.05*bl('eagle');
  D.critMult=S.up.eye?12:6;
  D.goldMult=(1+r.gold)*(S.up.map1?1.5:1)*(S.up.map2?2:1)*(buffs.midas>0?3:1)*(1+.5*bl('greed'))*(1+.03*(Object.keys(S.hats).length-1));
  D.ach=ach;
  D.luck=(1+r.luck)*(1+.3*bl('leaf'))*(S.up.det1?1.6:1)*(S.up.det2?1.6:1);
  D.bossDur=30+r.boss+6*bl('sand');D.r=r;D.cry=cry;D.tier=tier;
}

function makeBlockTex(d,type,seed){
  const p=bio(d),R=rng(seed),c=mk(B,B),x=c.getContext('2d');
  const sh=type==='boss'?p.block.map(s=>shade(s,.82)):p.block;
  const N=5,g=[];for(let i=0;i<N*N;i++)g.push(R());
  const cell=B/(N-1);
  for(let y=0;y<B;y++)for(let X=0;X<B;X++){
    const gx=X/cell,gy=y/cell,ix=Math.min(N-2,Math.floor(gx)),iy=Math.min(N-2,Math.floor(gy)),fx=gx-ix,fy=gy-iy;
    const v=(g[iy*N+ix]*(1-fx)+g[iy*N+ix+1]*fx)*(1-fy)+(g[(iy+1)*N+ix]*(1-fx)+g[(iy+1)*N+ix+1]*fx)*fy+(R()-.5)*.38;
    let k=v<.42?1:v<.72?2:3;if(R()<.035)k=0;
    x.fillStyle=sh[k];x.fillRect(X,y,1,1);
  }
  x.fillStyle=sh[3];x.fillRect(0,0,B,1);x.fillRect(0,0,1,B);
  x.fillStyle=sh[0];x.fillRect(0,B-1,B,1);x.fillRect(B-1,0,1,B);
  if(p.deco==='glyph'&&type!=='boss'){x.fillStyle=sh[0];x.fillRect(1,11,B-2,1);x.fillRect(11,1,1,10);x.fillRect(6,12,1,11);x.fillRect(17,12,1,11);}
  if(d===0){x.fillStyle='#5cbf4a';x.fillRect(0,0,B,2);x.fillStyle='#3d8f34';for(let i=0;i<B;i++)if(R()<.5)x.fillRect(i,2,1,1+(R()<.3?1:0));x.fillStyle='#8fe070';for(let i=0;i<B;i+=3)x.fillRect(i,0,1,1);}
  if(type==='ore'){
    const n=4+(R()*3|0);
    for(let i=0;i<n;i++){const cx=3+(R()*17|0),cy=3+(R()*17|0);
      x.fillStyle=sh[0];x.fillRect(cx+1,cy+1,2,2);x.fillStyle=p.oreC[0];x.fillRect(cx,cy,2,2);if(R()<.6)x.fillRect(cx+2,cy,1,1);
      x.fillStyle=p.oreC[1];x.fillRect(cx,cy,1,1);}
  }
  if(type==='gem'){
    for(let i=0;i<2;i++){const cx=6+(R()*12|0),cy=6+(R()*12|0);
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const m=A(dx)+A(dy);if(m>3)continue;x.fillStyle=m===3?sh[0]:p.gemC[0];x.fillRect(cx+dx,cy+dy,1,1);}
      x.fillStyle=p.gemC[1];x.fillRect(cx-1,cy-1,1,1);x.fillRect(cx,cy-1,1,1);}
  }
  if(type==='chest')x.drawImage(SPR.chest,6,8);
  if(type==='boss'){
    x.fillStyle='#1b1424';x.fillRect(0,0,B,1);x.fillRect(0,B-1,B,1);x.fillRect(0,0,1,B);x.fillRect(B-1,0,1,B);
    [5,14].forEach((ex,k)=>{
      x.fillStyle='#1b1424';x.fillRect(ex-1,7,7,6);
      x.fillStyle='#fff6e0';x.fillRect(ex,8,5,4);
      x.fillStyle='#e5533f';x.fillRect(ex+1,8,2,2);x.fillStyle='#1b1424';x.fillRect(ex+1,8,1,1);
      x.fillStyle='#1b1424';
      if(k===0){x.fillRect(ex-1,5,3,1);x.fillRect(ex+2,6,3,1);}else{x.fillRect(ex-1,6,3,1);x.fillRect(ex+2,5,3,1);}
    });
    x.fillStyle='#1b1424';x.fillRect(6,15,12,5);
    x.fillStyle='#fff6e0';[7,10,13,16].forEach(t=>x.fillRect(t,15,1,2));[8,11,14].forEach(t=>x.fillRect(t,18,1,2));
  }
  return c;
}
function makeCracks(seed){
  const R=rng(seed^0x9e3779),walks=[];
  for(let i=0;i<4;i++){let px=9+R()*6,py=9+R()*6,a=R()*Math.PI*2;const pts=[];
    for(let s=0;s<12;s++){a+=(R()-.5)*1.1;px+=Math.cos(a)*1.2;py+=Math.sin(a)*1.2;const ix=Math.round(px),iy=Math.round(py);if(ix<1||iy<1||ix>B-2||iy>B-2)break;pts.push(ix,iy);}
    walks.push(pts);}
  return walks;
}
const texCache=new Map();
function getTex(spec){
  let t=texCache.get(spec.seed);
  if(!t){t={c:makeBlockTex(spec.d,spec.type,spec.seed),cracks:makeCracks(spec.seed)};texCache.set(spec.seed,t);
    if(texCache.size>48)texCache.delete(texCache.keys().next().value);}
  return t;
}

function makeTile(p,v,f){

  const sh=bi.block.map(s=>shade(s,f)),cells=[];for(let i=0;i<16;i++)cells.push(R());
  for(let y=0;y<8;y++)for(let X=0;X<8;X++){const q=cells[(y>>1)*4+(X>>1)]*.7+R()*.3;const k=q<.28?0:q<.86?1:2;x.fillStyle=sh[k];x.fillRect(X,y,1,1);}
  if(bi.deco==='glyph'){x.fillStyle=sh[0];x.fillRect(0,3,8,1);x.fillRect(0,7,8,1);x.fillRect((v%2)*4,0,1,3);x.fillRect(((v+1)%2)*4+2,4,1,3);}
  const gf=Math.max(f,.75),P=(col,px,py,w,h)=>{x.fillStyle=shade(col,gf);x.fillRect(px,py,w||1,h||1);};
  if(v===4){const cx=1+(R()*5|0),cy=1+(R()*5|0);P(bi.oreC[0],cx,cy,2,1);P(bi.oreC[0],cx+(R()<.5?0:1),cy+1);P(bi.oreC[1],cx,cy);}
  if(v===5){

      case 'crack':[[1,1],[2,2],[3,2],[4,3],[5,4],[5,5]].forEach(a=>P('#0d0b10',a[0],a[1]));break;
      case 'shroom':P('#d8e8d0',3,5,1,3);P('#59ffc8',2,4,3,1);P('#e0fff4',3,3);P('#59ffc8',6,6);break;
      case 'icicle':P('#e8fbff',2,0,3,1);P('#e8fbff',3,1,1,2);P('#ffffff',3,0);break;
      case 'lava':P('#ff6a1f',1,4,5,1);P('#ffd04a',2,4,2,1);P('#ff6a1f',5,5);break;
      case 'crystal':P('#ff8ae0',3,2,1,4);P('#ff8ae0',4,3,1,3);P('#ff8ae0',2,4,1,2);P('#ffe0f6',3,2);break;
      case 'glyph':P('#ffd23a',3,4);P('#ffd23a',2,5);P('#ffd23a',4,5);P('#ffd23a',3,6);break;
      case 'vein':[[0,2],[1,3],[2,3],[3,4],[4,4],[5,5],[6,5],[7,6]].forEach(a=>P('#ffdc5a',a[0],a[1]));break;

function tone(f,d,o){o=o||{};if(!AC||S.muted)return;const t=AC.currentTime+(o.delay||0);const os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+d);
  g.gain.setValueAtTime(o.v||.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(AC.destination);os.start(t);os.stop(t+d+.05);}

function rollRelic(b){

    toast(`유물 발견! ${r.name} · ${relicDesc(r)}`,'relic',r.icon);relicDirty=true;}

function breakBlock(){
  const b=cur,g=goldOf(b.d,b.type),top=S.depth*B,p=bio(b.d);
  addGold(g);S.blocks++;
  if(b.type==='chest')S.chests++;
  if(b.type==='boss')S.bosses++;
  if(b.type==='ore'||b.type==='gem')S.ores++;
  const cols=b.type==='ore'?[p.block[1],p.block[2],p.oreC[0]]:b.type==='gem'?[p.block[2],p.gemC[0],p.gemC[1]]:[p.block[0],p.block[1],p.block[2],p.block[3]];

  popup('+'+fmt(g),'gold'+(big?' big':''),COLX+12,SURF-6);

  ensureAudio();S.cd[sk.id]=sk.cd*Math.pow(.85,bl('rhythm'));S.skillUses++;

      const wasBoss=cur.type==='boss',need=cur.hp;

function update(dt){
  let changed=false;
  for(const k in buffs)if(buffs[k]>0){buffs[k]-=dt;if(buffs[k]<=0){buffs[k]=0;changed=true;}}
  if(changed)recalc();
  if(D.dps>0){const a=D.dps*dt;dpsAcc+=a;damage(a);}
  dpsT+=dt;
  if(dpsT>=1){dpsT=0;if(dpsAcc>0){popup(fmt(dpsAcc),'dps',COLX+12+(Math.random()-.5)*10,SURF+18);hop=.16;}dpsAcc=0;}
  if(cur&&cur.type==='boss'&&buffs.stop<=0){bossLeft-=dt;if(bossLeft<=0)bossFail();}
  if(S.farm){farmT+=dt;if(farmT>3&&D.dps*D.bossDur*.8>=hpOf(S.depth)*BAL.boss){farmT=0;retryBoss();toast('동료들이 충분히 강해졌어요. 보스에 다시 도전!','win');}}
  for(const k in S.cd)if(S.cd[k]>0)S.cd[k]=Math.max(0,S.cd[k]-dt);
  comboIdle+=dt;if(comboIdle>.5&&combo>0&&buffs.fever<=0)combo=Math.max(0,combo-35*dt/(1+bl('ember')));
  if(combo<100)feverCharge=0;
  quakeT-=dt;
  if(cur&&cur.type==='boss'&&!blessOpts){
    weakT-=dt;if(weak){weak.life-=dt;if(weak.life<=0)weak=null;}
    if(!weak&&weakT<=0){weak={x:COLX+4+(Math.random()*16|0),y:SURF+4+(Math.random()*16|0),life:1.4};weakT=1+Math.random()*1.5;}
  }else weak=null;
  const target=S.depth*B;
  if(moleY<target){vy+=760*dt;moleY+=vy*dt;if(target-moleY>B*4)moleY=target-B*4;
    if(moleY>=target){moleY=target;if(vy>90)burstAt(COLX+12,target,6,['#9b8f8a','#6d625e'],50,120,1);vy=0;}}
  else if(moleY>target){moleY=target;vy=0;}
  swing-=dt;shakeT-=dt;hop-=dt;flash=Math.max(0,flash-dt*1.2);if(cur&&cur.pop>0)cur.pop-=dt;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  if(parts.length>260)parts.splice(0,parts.length-260);
  nugT-=dt;
  if(!nug&&nugT<=0){const left=Math.random()<.5;nug={x:Math.round(left?6+Math.random()*32:90+Math.random()*28),y:Math.round(10+Math.random()*60),life:13};nugT=(55+Math.random()*60)*(S.up.sense?.6:1)*Math.pow(.7,bl('magnet'));sfx.nug();}
  if(nug){nug.life-=dt;if(nug.life<=0)nug=null;}
}

  if(quakeT>0&&!REDUCE)ctx.setTransform(1,0,0,1,Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*3));
  if(cam<0)drawSky(cam,t);
  // walls
  const ty0=Math.max(0,Math.floor(cam/8)),ty1=Math.floor((cam+H-1)/8);
  for(let ty=ty0;ty<=ty1;ty++){const wy=ty*8,sy=wy-cam,p=palIdx(Math.floor(wy/B));for(let tx=0;tx<16;tx++)ctx.drawImage(TILES[p][variant(tx,ty)],tx*8,sy);}
  if(cam<4&&cam>-H){const gy=-cam;ctx.fillStyle='#5cbf4a';ctx.fillRect(0,gy,W,2);ctx.fillStyle='#3d8f34';for(let X=0;X<W;X+=3)ctx.fillRect(X,gy+2,1,(X*7)%3===0?2:1);ctx.fillStyle='#8fe070';for(let X=1;X<W;X+=5)ctx.fillRect(X,gy-1,1,1);}
  // carved shaft
  const a=Math.max(0,-cam),b=Math.min(H,S.depth*B-cam);
  if(b>a){drawBackRegion(COLX,a,B,b-a,cam);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(COLX,a,1,b-a);ctx.fillRect(COLX+B-1,a,1,b-a);}
  // helper alcoves
  const owned=[];for(let i=HELPERS.length-1;i>=0&&owned.length<2;i--)if(S.helpers[i]>0)owned.push(i);
  if(owned.length){
    const ay=SURF-15,underground=cam+ay>=0;
    const slots=[[COLX-15,true],[COLX+B+1,false]];
    owned.forEach((hi,k)=>{
      const sl=slots[k===0?1:0],axp=sl[0];
      if(underground){drawBackRegion(axp,ay,14,15,cam);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(axp,ay,14,1);}
      const bob=(hop>0&&((k+Math.floor(t*8))%2===0))?-1:0;
      ctx.drawImage(sl[1]?SPR.helpers[hi]:SPR.helpersL[hi],axp+1,SURF-12+bob);
    });
  }
  // blocks
  for(let i=0;i<5;i++){
    const d=S.depth+i,sy=d*B-cam;if(sy>=H)break;if(sy+B<=0)continue;
    if(i===0&&cur){
      const ox=(shakeT>0&&!REDUCE)?(Math.random()<.5?-1:1):(cur.type==='boss'&&!REDUCE&&Math.sin(t*24)>.85?1:0);
      ctx.drawImage(cur.tex.c,COLX+ox,sy);
      const stage=Math.min(4,Math.floor((1-cur.hp/cur.max)*5));
      if(stage>0){ctx.fillStyle='rgba(10,6,12,.85)';cur.tex.cracks.forEach(w=>{const n=Math.floor(w.length/2*stage/4);for(let j=0;j<n;j++)ctx.fillRect(COLX+ox+w[2*j],sy+w[2*j+1],1,1);});}
      if(cur.pop>0){ctx.globalAlpha=Math.min(1,cur.pop/.18);ctx.fillStyle='#fff';ctx.fillRect(COLX,sy,B,B);ctx.globalAlpha=1;}
      if(cur.type==='boss'){ctx.globalAlpha=.18+.12*Math.sin(t*6);ctx.fillStyle='#ff3a2a';ctx.fillRect(COLX,sy,B,B);ctx.globalAlpha=1;}
      // target brackets
      ctx.fillStyle=cur.type==='boss'?'#ff7a4a':'#fff6e0';ctx.globalAlpha=.55+.3*Math.sin(t*4);
      const x0=COLX+ox,x1=COLX+ox+B-1,y0=sy,y1=sy+B-1;
      [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([x,y,dx,dy])=>{ctx.fillRect(dx>0?x:x-3,y,4,1);ctx.fillRect(x,dy>0?y:y-3,1,4);});
      ctx.globalAlpha=1;
    }else{
      ctx.drawImage(getTex(specAt(d)).c,COLX,sy);
    }
  }
  const by=Math.max(0,S.depth*B-cam);
  if(by<H){ctx.fillStyle='#07040a';ctx.fillRect(COLX-1,by,1,H-by);ctx.fillRect(COLX+B,by,1,H-by);
    ctx.fillStyle='rgba(255,240,200,.18)';ctx.fillRect(COLX-2,by,1,H-by);ctx.fillRect(COLX+B+1,by,1,H-by);}
  // mole
  const blink=(t%3.4)<.12;
  ctx.drawImage(moleSpr(blink,t),56,SURF-16);
  drawPick(swing>0);
  // particles
  for(const p of parts){const sy=Math.round(p.y-cam);if(sy<-2||sy>H)continue;ctx.globalAlpha=Math.min(1,p.life*2.5);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),sy,p.s,p.s);}
  ctx.globalAlpha=1;
  // boss weak spot
  if(weak&&!(weak.life<.4&&Math.floor(t*12)%2)){
    ctx.fillStyle=Math.floor(t*8)%2?'#ffffff':'#ff3a2a';
    ctx.fillRect(weak.x-1,weak.y-4,3,2);ctx.fillRect(weak.x-1,weak.y+3,3,2);ctx.fillRect(weak.x-4,weak.y-1,2,3);ctx.fillRect(weak.x+3,weak.y-1,2,3);
    px(weak.x,weak.y,'#fff6a0');
  }
  // nugget
  if(nug){const vis=nug.life>3||Math.floor(t*8)%2===0;if(vis){ctx.drawImage(SPR.nug,nug.x,nug.y);
    if(Math.floor(t*5)%2===0){px(nug.x-2,nug.y+1,'#fff');px(nug.x+9,nug.y+4,'#fff');px(nug.x+4,nug.y-2,'#fff');}
    else{px(nug.x-1,nug.y+5,'#fff6a0');px(nug.x+8,nug.y-1,'#fff6a0');}}}
  // darkness
  const vi=S.depth<3?-1:Math.min(3,Math.floor(biomeIdx(S.depth)*.55));
  if(vi>=0){ctx.globalAlpha=.7;ctx.drawImage(VIG[vi],0,0);ctx.globalAlpha=1;}
  if(flash>0){ctx.globalAlpha=Math.min(1,flash);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(buffs.midas>0){ctx.globalAlpha=.1+.05*Math.sin(t*5);ctx.fillStyle='#f6c64b';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(buffs.fever>0){ctx.globalAlpha=.12+.08*Math.sin(t*14);ctx.fillStyle='#ff5a2a';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(buffs.stop>0){ctx.globalAlpha=.16;ctx.fillStyle='#8fd0ff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.setTransform(1,0,0,1,0,0);
}

screen.addEventListener('pointerdown',e=>{
  if(e.target.closest('#retry')||e.target.closest('#bless')||e.target.closest('#welcome'))return;
  e.preventDefault();screen.focus({preventScroll:true});
  const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
  if(weak&&A(lx-weak.x)<7&&A(ly-weak.y)<7){hitWeak();return;}
  if(nug&&A(lx-(nug.x+4))<9&&A(ly-(nug.y+3))<9){catchNug();return;}
  hit();
});
document.addEventListener('keydown',e=>{
  if(!$('#welcome').hidden&&(e.code==='Space'||e.code==='Enter'||e.code==='Escape')){e.preventDefault();closeWelcome();return;}
  if((e.code==='Space'||e.code==='Enter')&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();if(!e.repeat)hit();}
  const si=['Digit1','Digit2','Digit3'].indexOf(e.code);if(si>=0&&!e.repeat){if(blessOpts)pickBless(si);else useSkill(si);}
});
$('#retry').addEventListener('click',()=>{ensureAudio();retryBoss();});
$('#wBtn').addEventListener('click',closeWelcome);
$('#mute').addEventListener('click',()=>{S.muted=!S.muted;syncControls();if(!S.muted){ensureAudio();sfx.coin();}});
document.querySelectorAll('.amt button').forEach(b=>b.addEventListener('click',()=>{S.buyAmt=b.dataset.amt==='max'?'max':+b.dataset.amt;syncControls();updatePanel();}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();save();}
  else if(hiddenAt){const s=(Date.now()-hiddenAt)/1000;hiddenAt=0;offline(s,1,'자리를 비운');last=performance.now();}
});
window.addEventListener('pagehide',save);



/* ---------- save backup code ---------- */
const CODE_TAG='MOLE1:';
let importUntil=0;
function normalize(src){
  const n=Object.assign(defaults(),src||{});
  n.helpers=HELPERS.map((_,i)=>(Array.isArray(n.helpers)&&+n.helpers[i])||0);
  ['up','relics','ach','cd','bless','hats'].forEach(k=>{if(!n[k]||typeof n[k]!=='object')n[k]={};});
  n.hats.basic=1;if(!n.daily||typeof n.daily!=='object')n.daily={day:'',streak:0};
  if(!Array.isArray(n.quests))n.quests=[];
  return n;
}
function exportSave(){
  save();
  const code=CODE_TAG+btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));
  rb.code.value=code;rb.code.select();
  const done=()=>toast('백업 코드를 복사했어요! 메모장이나 메시지에 붙여 넣어 보관하세요.','win',SPR.nug);
  const fallback=()=>{try{document.execCommand('copy');done();}catch(e){toast('코드를 길게 눌러 직접 복사해 주세요.','warn');}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done,fallback);else fallback();
}
function importSave(){
  const raw=rb.code.value.trim().replace(/\s+/g,'');
  let data=null;
  try{data=JSON.parse(decodeURIComponent(escape(atob(raw.startsWith(CODE_TAG)?raw.slice(CODE_TAG.length):raw))));}catch(e){}
  if(!data||typeof data.gold!=='number'||!Array.isArray(data.helpers)){toast('백업 코드가 올바르지 않아요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요.','warn');importUntil=0;updateRebirth();return;}
  const now=performance.now();if(now>importUntil){importUntil=now+3000;updateRebirth();return;}
  importUntil=0;
  S=normalize(data);S.last=Date.now();
  Object.keys(buffs).forEach(k=>buffs[k]=0);texCache.clear();parts.length=0;nug=null;weak=null;combo=0;
  closeBless();$('#welcome').hidden=true;ensureQuests();setLogo();
  recalc();moleY=S.depth*B;vy=0;spawn();
  toolSig='';questSig='';relicDirty=true;achDirty=true;rb.sig='';
  updatePanel();syncControls();save();rb.code.value='';
  if(S.pendingBless)setTimeout(offerBless,500);
  sfx.relic();toast(`기록을 불러왔어요! 깊이 ${S.depth}m · 골드 ${fmt(S.gold)}`,'win',SPR.crys);
}

/* ---------- install as an app (PWA) ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function syncInstall(){
  const can=!isStandalone()&&(!!installEvt||isIOS());
  $('#install').hidden=!can;
  $('#home').hidden=isStandalone();
  if(rb.inst){rb.inst.hidden=!can;
    rb.instP.textContent=isStandalone()?'지금 앱으로 실행 중이에요. 홈 화면 아이콘으로 언제든 바로 들어올 수 있어요.'
      :can?'홈 화면에 설치하면 앱처럼 전체 화면으로 열리고, 인터넷이 끊겨도 플레이할 수 있어요.'
      :'이 브라우저에서는 메뉴(⋮)의 "홈 화면에 추가" 또는 "앱 설치"로 설치할 수 있어요.';}
}
function installApp(){
  ensureAudio();
  if(installEvt){
    const ev=installEvt;installEvt=null;ev.prompt();
    ev.userChoice.then(r=>{if(r.outcome==='accepted'){sfx.win();toast('설치 완료! 홈 화면에서 두더지를 만나요.','win',SPR.mole);}syncInstall();});
  }else if(isIOS()){
    toast('Safari 아래쪽 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 고르세요.','win',SPR.mole);
  }
  syncInstall();
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;syncInstall();});
addEventListener('appinstalled',()=>{installEvt=null;syncInstall();});
$('#install').addEventListener('click',installApp);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- boot ---------- */
SPR.crys=shapeIcon('crystal','#ff7ad9');
let last=performance.now();
function frame(now){
  const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;
  update(dt);draw(now/1000);
  requestAnimationFrame(frame);
}
function start(data){
  const src=(data&&typeof data.gold==='number')?data:load();
  S=normalize(src);
  recalc();moleY=S.depth*B;spawn();
  if(!HAT_BY[S.hat])S.hat='basic';setLogo();$('#coinIco').appendChild(clone(shapeIcon('coin','#f6c64b'),'pi'));
  ensureQuests();if(S.pendingBless)setTimeout(offerBless,800);
  buildHelpers();buildSkills();syncControls();setTab('helpers');
  syncInstall();
  if(S.clicks>=5){hintLeft=0;$('#hint').hidden=true;}
  if(src&&src.last)offline((Date.now()-src.last)/1000,.5,'창을 닫아 둔');
  if(S.depth===0&&S.clicks===0)banner('두더지 광산','0m · 표토층');
  setInterval(updateHud,100);setInterval(updatePanel,250);setInterval(save,15000);setInterval(checkAch,1000);
  if(window.__mmExpose)window.__mm={get S(){return S;},D,buffs,BAL,draw,update,hit,useSkill,buyHelper,costOf,maxBuy,recalc,crystalGain,UPS,HELPERS,
    get cur(){return cur;},get combo(){return combo;},retryBoss,onRebirth,checkAch,buyUp:id=>{const u=UPS.find(x=>x.id===id);if(u&&S.gold>=u.cost&&!S.up[id]&&u.req()){S.gold-=u.cost;S.up[id]=1;recalc();return true;}return false;}};
  updateHud();
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(serialize);
  last=performance.now();requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>
